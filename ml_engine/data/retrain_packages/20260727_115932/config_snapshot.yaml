# ML Engine Configuration

data:
  # Data fetch settings
  # [NOTE: Phase 9 Legacy Fallback] 
  # This static symbol list is deprecated for live trading. 
  # The system dynamically uses ml_engine/data/symbol_registry.json for hot-maintenance.
  symbols:
    - "BTCUSDT"
    - "ETHUSDT"
    - "SOLUSDT"
  timeframe: "1h"
  start_date: "2022-01-01T00:00:00Z"
  raw_dir: "data/raw"

features:
  # Triple-Barrier settings
  take_profit_pct: 0.02    # +2%
  stop_loss_pct: -0.01     # -1%
  horizon_periods: 8       # 8 hours

training:
  # XGBoost Hyperparameters (High Regularization)
  max_depth: 4
  eta: 0.03
  subsample: 0.7
  colsample_bytree: 0.7
  min_child_weight: 10
  reg_alpha: 0.5
  reg_lambda: 2.0
  n_estimators: 2000
  early_stopping_rounds: 50
  
  # Rolling Validation Splits (Dates)
  train_start: "2022-01-01"
  train_end: "2023-06-30"
  val_start: "2023-07-01"
  val_end: "2024-06-30"
  test_start: "2024-07-01"
  test_end: "2025-01-01"

inference:
  # ZMQ Publisher settings
  zmq_port: 5555
  
  # Confidence Thresholds
  prob_reject: 0.50
  prob_record_only: 0.55
  prob_tier_1: 0.58
  prob_tier_2: 0.62
  
  # Cooldowns (in hours)
  cooldown_hours_standard: 2
  cooldown_hours_layer3: 2
  
  # Layer 3 Assets definitions
  layer3_assets:
    - "JSTUSDT"
    - "USUSDT"

monitoring:
  # AUC Drift Monitor Settings
  auc_threshold: 0.52
  consecutive_days_alert: 3
  calm_period_days: 7
  min_trades_for_calm_exit: 30

telegram:
  # Telegram Bot Settings for Alerts
  bot_token: "8283601864:AAEqcNejr5z9lnL1OBRlm_CzGkMXDNmeNd4"   # FILL IN YOUR BOT TOKEN HERE
  chat_id: "1830374161"     # FILL IN YOUR CHAT ID HERE
